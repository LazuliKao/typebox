name: Publish

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            packages: write

        steps:
            - uses: actions/checkout@v6

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: latest
                  cache: true

            - name: Update package name and scope
              run: |
                  REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  NODE_PKG_NAME="@$REPO_LOWER"
                  node -e "const pkg = JSON.parse(require('fs').readFileSync('package.json')); pkg.name = '$NODE_PKG_NAME'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2))"
                  echo "SCOPE=@$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '${{ env.SCOPE }}'

            - name: Extract version
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Update version
              run: |
                  npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

            - name: Publish package
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish to JSR
              run: deno publish

            - name: Pack npm package
              run: deno pack --output typebox.tgz

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            - run: tar -xzf typebox.tgz
            - working-directory: package
              run: npm publish --tag latest

    releases:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v6

            - name: Build
              run: npx ts-json-schema-generator --path schema.ts --type "schema" -o schema.json

            - name: Build
              run: npx ts-json-schema-generator --path schema.ts --type "rule_set_schema" -o rule_set.json

            - name: Release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      schema.json
                      rule_set.json
